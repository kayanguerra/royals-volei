name: Otimizar imagens

on:
  push:
    branches: [main]
    paths:
      - "assets/gallery/**"

permissions:
  contents: write

jobs:
  otimizar:
    # Evita loop: não roda de novo no commit feito por ele mesmo.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: python .github/scripts/otimizar_imagens.py
      - name: Salvar imagens reduzidas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gallery
          git diff --cached --quiet || git commit -m "Otimiza imagens da galeria"
          git push
